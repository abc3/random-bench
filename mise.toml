[env]
AWS_PROFILE = "sandbox"
AWS_REGION = "eu-central-1"
CLUSTER_NAME = "smolquery-dev"
KUBE_CONTEXT = "eks-smolquery-dev"
KUBECONFIG = "{{env.HOME}}/Dev/supabase/smolquery-deploy/smolquery-deploy/.kubeconfig"
SECRETS_FILE = "{{env.HOME}}/Dev/supabase/smolquery-deploy/smolquery-deploy/secrets.env.json"

# ── local arms ───────────────────────────────────────────────────────────────

[tasks.bodies]
description = "Generate the deterministic NDJSON body (seed 42, BASE_DATE=YYYY-MM-DD to backdate)"
run = "elixir scripts/gen-bodies.exs"

[tasks.report]
description = "Markdown table from a results directory (RESULTS=... to pick one)"
run = "elixir scripts/report.exs"

[tasks.stop]
description = "Stop both local servers"
run = "elixir scripts/stop.exs"

# ── remote arm, driven from this machine ─────────────────────────────────────

[tasks.remote-setup]
description = "Health check the deployed cluster, then ensure the dataset and table"
run = "elixir scripts/setup-remote.exs"

[tasks.remote-run]
description = "One run against the deployed cluster (VUS=... DURATION_S=...)"
run = "elixir scripts/run-arm.exs remote"

[tasks.remote-sweep]
description = "VU sweep against the deployed cluster from this machine"
run = "elixir scripts/sweep.exs remote"

[tasks.remote-report]
description = "Markdown table for the remote arm's results"
run = "RESULTS=results/raw-remote elixir scripts/report.exs"

[tasks.pods]
description = "Sample pod CPU and RSS for N seconds (usage: mise run pods -- 30 out.json)"
run = "elixir scripts/watch-pods.exs"

[tasks.metrics]
description = "Sample every pod's metrics into SQLite for N seconds (usage: mise run metrics -- 300 out.sqlite3)"
run = "elixir scripts/watch-metrics.exs"

# ── in-region load generator ─────────────────────────────────────────────────

[tasks.bench-up]
description = "Launch the eu-central-1 k6 box, install k6 + Go, push the harness, build the body"
run = "elixir scripts/loadgen.exs up"

[tasks.bench-status]
description = "Load generator state: instance, SSM ping, and the api pod it targets"
run = "elixir scripts/loadgen.exs status"

[tasks.bench-sweep]
description = "Run the selected benches (BENCHES=ingest,pruning,compaction; default ingest)"
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-ingest]
description = "Ingest bench only: the VU sweep, pod sampling, results pulled back"
env = { BENCHES = "ingest" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-pruning]
description = "Pruning bench only: time a single-date query against a live and an empty date"
env = { BENCHES = "pruning" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-compaction]
description = "Compaction bench only: watch both storage pods for COMPACT_WATCH_S seconds"
env = { BENCHES = "compaction" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-onebrc]
description = "One billion rows: generate the CSV on the box, upload it, then time the 1BRC query ten times (ONEBRC_ROWS=..., ONEBRC_WORKERS=...)"
env = { BENCHES = "onebrc", TABLE = "onebrc_v1" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-onebrc-ingest]
description = "One billion rows, ingest only: one full upload per worker count into a fresh table each, no query phase (ONEBRC_WORKERS=\"16 32 48 64 96 128\", TABLE=onebrc_v3)"
env = { BENCHES = "onebrc", TABLE = "onebrc_v3", ONEBRC_QUERIES = "false", ONEBRC_WORKERS = "16 32 48 64 96 128", ONEBRC_UPLOAD_DEADLINE_S = "600" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-attrs]
description = "Attributes bench: the ingest sweep, then project-scoped attribute queries over hot ∪ sealed and sealed (set SHAPE, TABLE, LABEL_SUFFIX and VUS_LIST in the shell)"
env = { BENCHES = "ingest,attrs" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-tail]
description = "Tail bench: the last 100 events per project, distributed vs single-engine, idle, under ingest, and sealed (set SHAPE, TABLE, LABEL_SUFFIX, TAIL_INGEST_VUS in the shell)"
env = { BENCHES = "tail" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-tsbs]
description = "TSBS cpu-only through the cluster's VictoriaMetrics edge: load once, query per build (TSBS_SCALES, TSBS_PHASES=load,query|query, TSBS_LABEL)"
env = { BENCHES = "tsbs" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-all]
description = "All three benches in order: ingest, then pruning, then compaction"
env = { BENCHES = "ingest,pruning,compaction" }
run = "elixir scripts/loadgen.exs sweep"

[tasks.bench-fetch]
description = "Pull results from the load generator without running a sweep"
run = "elixir scripts/loadgen.exs fetch"

[tasks.bench-report]
description = "Markdown table for the load generator's results"
run = "RESULTS=results/raw-loadgen elixir scripts/report.exs"

[tasks.report-html]
description = "Charted HTML report for one run (usage: mise run report-html -- results/raw-loadgen/<run>.metrics.sqlite3)"
run = "elixir scripts/report-html.exs"

[tasks.bench-ssh]
description = "Print the SSM start-session command for the load generator"
run = "elixir scripts/loadgen.exs ssh"

[tasks.bench-down]
description = "Terminate the load generator"
run = "elixir scripts/loadgen.exs down"

# ── TSBS against one local node's VictoriaMetrics edge ───────────────────────

[tasks.tsbs-setup]
description = "Install the TSBS commands and build tools/tsbsrw into $TSBS_DIR/bin (default ~/tsbs)"
run = "elixir scripts/tsbs.exs setup"

[tasks.tsbs-build]
description = "Prod-build a smolquery ref as a worktree (usage: mise run tsbs-build -- before origin/main)"
run = "elixir scripts/tsbs.exs build"

[tasks.tsbs-gen]
description = "Generate the cpu-only data and query files for SCALE over HOURS"
run = "elixir scripts/tsbs.exs gen"

[tasks.tsbs-run]
description = "Start a build, load through remote write, drain, verify, query, stop (usage: mise run tsbs-run -- before)"
run = "elixir scripts/tsbs.exs run"

[tasks.tsbs-report]
description = "Markdown tables for LABELS at SCALE from results/raw-tsbs"
run = "elixir scripts/tsbs.exs report"

# ── scatter admission, one local node ────────────────────────────────────────

[tasks.scatter-admission]
description = "Boot one node, load bench.events, run the 8-client single vs distributed arms (SMOLQUERY_DIR required; usage: mise run scatter-admission -- [all|load|arms|serve|report])"
run = "scripts/scatter_admission.sh"

[tasks.scatter-admission-report]
description = "Markdown tables for a finished scatter admission run (OUT=results/raw-scatter/<run>)"
run = "scripts/scatter_admission.sh report"
